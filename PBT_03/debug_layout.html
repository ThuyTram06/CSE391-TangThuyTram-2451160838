<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Debug Layout</title>
    <link rel="stylesheet" href="debug_layout.css">
</head>
<body>

<h2>Layout bị vỡ</h2>
<div class="container broken">
    <div class="sidebar">Sidebar</div>
    <div class="content">Content</div>
</div>

<h2>Fix bằng border-box</h2>
<div class="container fixed-1">
    <div class="sidebar">Sidebar</div>
    <div class="content">Content</div>
</div>

<h2>Fix không dùng border-box</h2>
<div class="container fixed-2">
    <div class="sidebar adjust">Sidebar</div>
    <div class="content adjust">Content</div>
</div>

</body>
</html>
