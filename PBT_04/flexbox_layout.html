<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Layout</title>

    <link rel="stylesheet" href="flexbox.css">
</head>
<body>

    <header class="navbar">

        <div class="logo">
            MyShop
        </div>

        <nav class="menu">
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">About</a>
        </nav>

        <div class="auth-buttons">
            <button class="login-btn">Login</button>
            <button class="register-btn">Register</button>
        </div>

    </header>

    <main class="container">

        <h1 class="title">
            Featured Products
        </h1>

        <div class="product-grid">

            <div class="card">
                <img src="https://picsum.photos/300/200?1" alt="Product">

                <div class="card-content">
                    <h3>iPhone 15</h3>
                    <p class="price">$999</p>

                    <button>Mua</button>
                </div>
            </div>

            <div class="card">
                <img src="https://picsum.photos/300/200?2" alt="Product">

                <div class="card-content">
                    <h3>Gaming Laptop</h3>
                    <p class="price">$1499</p>

                    <button>Mua</button>
                </div>
            </div>

            <div class="card">
                <img src="https://picsum.photos/300/200?3" alt="Product">

                <div class="card-content">
                    <h3>Headphone</h3>
                    <p class="price">$199</p>

                    <button>Mua</button>
                </div>
            </div>

            <div class="card">
                <img src="https://picsum.photos/300/200?4" alt="Product">

                <div class="card-content">
                    <h3>Smart Watch</h3>
                    <p class="price">$299</p>

                    <button>Mua</button>
                </div>
            </div>

            <div class="card">
                <img src="https://picsum.photos/300/200?5" alt="Product">

                <div class="card-content">
                    <h3>Camera</h3>
                    <p class="price">$799</p>

                    <button>Mua</button>
                </div>
            </div>

            <div class="card">
                <img src="https://picsum.photos/300/200?6" alt="Product">

                <div class="card-content">
                    <h3>Keyboard</h3>
                    <p class="price">$99</p>

                    <button>Mua</button>
                </div>
            </div>

            <div class="card">
                <img src="https://picsum.photos/300/200?7" alt="Product">

                <div class="card-content">
                    <h3>Monitor</h3>
                    <p class="price">$399</p>

                    <button>Mua</button>
                </div>
            </div>

            <div class="card">
                <img src="https://picsum.photos/300/200?8" alt="Product">

                <div class="card-content">
                    <h3>Speaker</h3>
                    <p class="price">$249</p>

                    <button>Mua</button>
                </div>
            </div>

        </div>

    </main>

</body>
</html>
