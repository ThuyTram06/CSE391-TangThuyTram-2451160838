<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi API Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="header">
        <h1>Multi API Dashboard</h1>

        <button id="refreshBtn">
            Refresh All
        </button>
    </div>

    <div id="globalLoading" class="global-loading">
        Đang tải dữ liệu...
    </div>

    <div id="loadTime"></div>

    <div class="dashboard">

        <div class="widget">
            <h2>Random User</h2>
            <div id="userWidget"></div>
        </div>

        <div class="widget">
            <h2>Weather Hanoi</h2>
            <div id="weatherWidget"></div>
        </div>

        <div class="widget">
            <h2>Random Dog</h2>
            <div id="dogWidget"></div>
        </div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
